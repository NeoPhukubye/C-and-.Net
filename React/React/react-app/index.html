<!doctype html>
<!-- The document language helps screen readers and browsers pick the right rules. -->
<html lang="en">
  <head>
    <!-- UTF-8 keeps special characters readable. -->
    <meta charset="UTF-8" />
    <!-- Serve the favicon from the public folder. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Make the layout scale correctly on mobile devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Short description used by search engines and link previews. -->
    <meta name="description" content="Manage blood donation candidates with a React and ASP.NET Core application." />
    <!-- Tint the browser chrome on mobile to match the app theme. -->
    <meta name="theme-color" content="#b71c1c" />
    <!-- Title shown in the browser tab. -->
    <title>Donation Candidate Management</title>
  </head>
  <body>
    <!-- React mounts the whole application inside this element. -->
    <div id="root"></div>
    <!-- Load the module entry point that starts React. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
